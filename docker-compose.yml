version: '3.8'

services:
  app:
    build: .
    container_name: myapp
    ports:
      - "5000:5000"
    environment:
      - ENV=development
    depends_on:
      - db


  db:
    image: postgres:15
    container_name: mydb
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
